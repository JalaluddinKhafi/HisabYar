
name: Build HisabYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Verify and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
